docs_dir: docs
site_name: linux-rt-upscaler
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [ src ]
          options:
            heading_level: 2
            show_source: false
            show_root_heading: true
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
nav:
  - Home: index.md
  - User Guide:
      - Installation: user/installation.md
      - Graphical User Interface (GUI): user/gui.md
      - Command-Line Interface (CLI): user/cli.md
      - Configuration: user/configuration.md
  - API Reference:
      - Overview: api/overview.md
      - Classes:
          - UpscalerSession: api/classes/upscaler_session.md
          - WindowInfo: api/classes/window_info.md
          - Config: api/classes/config.md
      - Modules:
          - Window Acquisition: api/modules/acquisition.md
          - Exceptions: api/modules/exceptions.md
  - Developer:
      - Overview: developer/overview.md